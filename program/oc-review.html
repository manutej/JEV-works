}
@media (prefers-color-scheme: dark) {

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --surface: #20201d; --ink: #ecebe6; --muted: #a8a69d; --line: #3a3934;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 1.1rem; margin: 0; }
h3 { font-size: .95rem; margin: 16px 0 6px; }
.meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
.tabs button, .toolbar select, .toolbar input, .theme { font: inherit; font-size: .85rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); cursor: pointer; min-width: 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.verdict { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.v-ACCEPT { background: var(--good-bg); color: var(--good); } .v-REFUSE { background: var(--bad-bg); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .8rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.heat { text-align: right; min-width: 64px; }
.strip { display: grid; gap: 1px; margin-top: 8px; }
.strip .row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
.strip .cells { display: grid; gap: 1px; }
.strip .c { height: 12px; background: var(--chip); border-radius: 1px; }
.strip .c.on { background: rgb(var(--heat)); }
.toolbar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input { flex: 1 1 160px; border-radius: 6px; cursor: text; }
.toolbar .count { color: var(--muted); font-size: .8rem; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.item.bad { border-left: 4px solid var(--bad); }
.item .head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: .72rem; padding: 1px 7px; border-radius: 99px; background: var(--chip); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.t { background: var(--good-bg); color: var(--good); } .chip.f { background: var(--bad-bg); color: var(--bad); }
.chip.e { border: 1px solid var(--bad); color: var(--bad); background: transparent; }
.state { margin: 6px 0 0; font-size: .85rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
details summary { cursor: pointer; color: var(--accent); font-size: .8rem; margin-top: 4px; }
.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
.nodes { font-size: .8rem; color: var(--muted); }
.nodes dt { font-weight: 600; color: var(--ink); } .nodes dd { margin: 0 0 4px 0; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
</style>

d~decomposed":{"agree":15,"n":18,"rate":0.8333},"mid~highrisk":{"agree":14,"n":18,"rate":0.7778},"decomposed~highrisk":{"agree":17,"n":18,"rate":0.9444}},"edges":[{"edge":"L*-M2","node":"M2","disagree":4,"n":18,"rate":0.2222,"ci95":[0.09,0.4522],"loadBearing":3,"nearThreshold":1,"pivots":{"L3":3,"L5":3,"L4":1},"highRisk":false},{"edge":"M*-R","node":"R","disagree":3,"n":18,"rate":0.1667,"ci95":[0.0584,0.3922],"loadBearing":3,"nearThreshold":3,"pivots":{"M2":3},"highRisk":false},{"edge":"L*-M1","node":"M1","disagree":0,"n":18,"rate":0,"ci95":[0,0.1759],"loadBearing":0,"nearThreshold":0,"pivots":{},"highRisk":true}],"replication":{"node":"M1","n":18,"medianAbsDp":0,"p95AbsDp":0.0215,"maxAbsDp":0.03,"flips":0,"withinP4":true},"correctness":null,"items":[{"id":"doc:0","label":null,"state":{"question":"How do I require human approval before a tool executes?","chunk":"## Tool Execution Approval\n\nBy default, tools with an `execute` function run automatically as the model calls them. Configure approval with `toolApproval` on `generateText`, `streamText`, or `ToolLoopAgent`.\n\n`toolApproval` can be either:\n\n- A `GenericToolApprovalFunction` for all tool calls\n- A per-tool map of statuses and/or `SingleToolApprovalFunction` callbacks (either function may return `undefined` for the same effect as `'not-applicable'`)\n\nThe older `needsApproval` property on `tool()` definitions is deprecated. Existing code still works, but new code should move approval logic to `toolApproval`.\n\n### Configure `toolApproval`\n\n```ts\nconst result = await generateText({\n  model: __MODEL__,\n  tools: { runCommand },\n  toolApproval: {\n    runCommand: 'user-approval',\n  },\n  prompt: 'Remove the most recent file in the downloads folder',\n});\n```\n\nIn the per-tool object form, each key can be one of four statuses: `'not-applicable'`, `'approved'`, `'denied'`, or `'user-approval'`, which emits an approval request and waits for an explicit response."},"p":{"direct":{"R":0.91},"mid":{"M1":0.95,"M2":0.92},"decomposed":{"L1":0.97,"L2":0.98,"L3":0.82,"L4":0.44,"L5":0.9},"highrisk":{"M1":0.96,"L3":0.83,"L4":0.42,"L5":0.9}},"ctx":{"direct":"ctx-e44e61a2-9782-478e-8c6f-a3f99c0a5f26","mid":"ctx-53472ae8-8ef7-4c11-ba4b-d49b34494de1","decomposed":"ctx-45cbe6fb-fd45-4e9e-a4ba-4e2fa8d136b2","highrisk":"ctx-ceaf634b-ed74-4110-b674-1da54a5c570f"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:1","label":null,"state":{"question":"How do I require human approval before a tool executes?","chunk":"## Tool Order\n\nSome providers include tool definitions in the cached portion of a request. If the order of those definitions changes between otherwise similar requests, the provider may not be able to reuse the cached prefix as effectively.\n\nUse `toolOrder` when you want a stable provider request shape for caching or debugging. The list can be partial: tools listed in `toolOrder` are sent first in that order, and any remaining tools are sent afterwards in alphabetical order. Tool names are typed from your `tools` object.\n\n```ts\nconst { text } = await generateText({\n  model: __MODEL__,\n  tools: myToolSet,\n  toolOrder: ['search', 'readFile'],\n  prompt: 'Summarize the latest project notes.',\n});\n```\n\n`toolOrder` controls only the order of tool definitions sent to the provider. It does not force the model to call a tool. Use `toolChoice` to control tool selection, and use `activeTools` when you want to limit which tools are available."},"p":{"direct":{"R":0.06},"mid":{"M1":0.03,"M2":0.1},"decomposed":{"L1":0.05,"L2":0.04,"L3":0.6,"L4":0.38,"L5":0.83},"highrisk":{"M1":0.03,"L3":0.6,"L4":0.4,"L5":0.82}},"ctx":{"direct":"ctx-cfc95db4-1610-4c6f-a087-efd58c58e3a9","mid":"ctx-bd8add77-0ab0-46ea-9752-33bb55dbdea3","decomposed":"ctx-60d198dc-ef30-4756-9f95-9de82ccd70bd","highrisk":"ctx-7103dd4b-09fc-48ef-ae0d-9d0f12b95efa"},"R":{"direct":false,"mid":false,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":false,"M2":false},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":true}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":true,"M*-R":false},"failing":["L*-M2"],"near":{"L*-M2":false}},{"id":"doc:2","label":null,"state":{"question":"What are the benefits of streaming responses to users?","chunk":"Streaming conversational text UIs (like ChatGPT) have gained massive popularity over the past few months. This section explores the benefits and drawbacks of streaming and blocking interfaces.\n\nLarge language models (LLMs) are extremely powerful. However, when generating long outputs, they can be very slow compared to the latency you're likely used to. If you try to build a traditional blocking UI, your users might easily find themselves staring at loading spinners for 5, 10, even up to 40s waiting for the entire LLM response to be generated. This can lead to a poor user experience, especially in conversational applications like chatbots. Streaming UIs can help mitigate this issue by displaying parts of the response as they become available.\n\nAs you can see, the streaming UI is able to start displaying the response much faster than the blocking UI. This is because the blocking UI has to wait for the entire response to be generated before it can display anything, while the streaming UI can display parts of the response as they become available."},"p":{"direct":{"R":0.9},"mid":{"M1":0.91,"M2":0.04},"decomposed":{"L1":0.92,"L2":0.92,"L3":0.02,"L4":0.02,"L5":0.03},"highrisk":{"M1":0.91,"L3":0.02,"L4":0.02,"L5":0.03}},"ctx":{"direct":"ctx-64720386-e6df-4ba2-b381-f31670d5bd83","mid":"ctx-9364cb54-8351-40dd-9fba-0cbe3e6d5fc9","decomposed":"ctx-3c0adb42-d147-4fb4-94a3-32eabb4d12b9","highrisk":"ctx-719f5a18-e281-4127-aac7-5b5cfb257950"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":false},"decomposed":{"M1":true,"M2":false},"highrisk":{"M1":true,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:3","label":null,"state":{"question":"What are the benefits of streaming responses to users?","chunk":"Embeddings are a way to represent words, phrases, or images as vectors in a high-dimensional space. In this space, similar words are close to each other, and the distance between words can be used to measure their similarity.\n\nThe AI SDK provides the `embed` function to embed single values, which is useful for tasks such as finding similar words or phrases or clustering text. You can use it with embeddings models, e.g. `openai.embeddingModel('text-embedding-3-large')` or `mistral.embeddingModel('mistral-embed')`.\n\n```tsx\nimport { embed } from 'ai';\n\nconst { embedding } = await embed({\n  model: 'openai/text-embedding-3-small',\n  value: 'sunny day at the beach',\n});\n```\n\nWhen loading data, e.g. when preparing a data store for retrieval-augmented generation (RAG), it is often useful to embed many values at once (batch embedding). The AI SDK provides the `embedMany` function for this purpose."},"p":{"direct":{"R":0.05},"mid":{"M1":0.03,"M2":0.51},"decomposed":{"L1":0.05,"L2":0.02,"L3":0.62,"L4":0.83,"L5":0.9},"highrisk":{"M1":0.03,"L3":0.64,"L4":0.85,"L5":0.9}},"ctx":{"direct":"ctx-03ed1b9c-4185-48e9-9463-8d4aedf66683","mid":"ctx-e8ed18ae-2122-4370-b557-d5fa200a7bb6","decomposed":"ctx-bc4e7cf6-c855-4578-8718-7875b58d2451","highrisk":"ctx-ec99de67-ccdc-4408-bb53-f6e05af471aa"},"R":{"direct":false,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":false,"M2":true},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":true}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":true},"failing":["M*-R"],"near":{"M*-R":true}},{"id":"doc:4","label":null,"state":{"question":"How do I embed a batch of many text values at once?","chunk":"## Embedding Many Values\n\nWhen loading data, e.g. when preparing a data store for retrieval-augmented generation (RAG), it is often useful to embed many values at once (batch embedding).\n\nThe AI SDK provides the `embedMany` function for this purpose. Similar to `embed`, you can use it with embeddings models, e.g. `openai.embeddingModel('text-embedding-3-large')` or `mistral.embeddingModel('mistral-embed')`.\n\n```tsx\nimport { embedMany } from 'ai';\n\n// 'embeddings' is an array of embedding objects (number[][]).\n// It is sorted in the same order as the input values.\nconst { embeddings } = await embedMany({\n  model: 'openai/text-embedding-3-small',\n  values: [\n    'sunny day at the beach',\n    'rainy afternoon in the city',\n    'snowy night in the mountains',\n  ],\n});\n```"},"p":{"direct":{"R":0.92},"mid":{"M1":0.95,"M2":0.94},"decomposed":{"L1":0.97,"L2":0.98,"L3":0.88,"L4":0.7,"L5":0.95},"highrisk":{"M1":0.95,"L3":0.87,"L4":0.7,"L5":0.96}},"ctx":{"direct":"ctx-e264f55f-f89b-4ff0-805b-455371eff818","mid":"ctx-7c06f164-4cf1-4f43-a7b6-9408c4d68658","decomposed":"ctx-0281d158-5da9-423b-a180-d8a4e782eb11","highrisk":"ctx-f50fedb8-c3f5-4dcd-bb4e-932513ef7609"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:5","label":null,"state":{"question":"How do I embed a batch of many text values at once?","chunk":"## Embedding Models\n\nAn embedding model is used to convert complex data (like words or images) into a dense vector (a list of numbers) representation, known as an embedding. Unlike generative models, embedding models do not generate new text or data. Instead, they provide representations of semantic and syntactic relationships between entities that can be used as input for other models or other natural language processing tasks.\n\nGenerative artificial intelligence refers to models that predict and generate various types of outputs (such as text, images, or audio) based on what's statistically likely, pulling from patterns they've learned from their training data. A large language model (LLM) is a subset of generative models focused primarily on text. An LLM takes a sequence of words as input and aims to predict the most likely sequence to follow."},"p":{"direct":{"R":0.16},"mid":{"M1":0.05,"M2":0.03},"decomposed":{"L1":0.25,"L2":0.04,"L3":0.04,"L4":0.01,"L5":0.04},"highrisk":{"M1":0.05,"L3":0.04,"L4":0.01,"L5":0.04}},"ctx":{"direct":"ctx-336cdbbf-c93f-46c1-901b-10cdcaa1dd12","mid":"ctx-ae6a1fc5-0651-4239-ac5d-c5322fcf7fd5","decomposed":"ctx-569e85a9-15f0-4745-9637-23ba8214984b","highrisk":"ctx-920fd568-928a-4b16-8219-faca775f8446"},"R":{"direct":false,"mid":false,"decomposed":false,"highrisk":false},"M":{"direct":{},"mid":{"M1":false,"M2":false},"decomposed":{"M1":false,"M2":false},"highrisk":{"M1":false,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:6","label":null,"state":{"question":"How do I limit which tools are visible to the model in a given call?","chunk":"## Active Tools\n\nLanguage models can only handle a limited number of tools at a time, depending on the model. To allow for static typing using a large number of tools and limiting the available tools to the model at the same time, the AI SDK provides the `activeTools` property.\n\nIt is an array of tool names that are currently active. By default, the value is `undefined` and all tools are active.\n\n```ts\nimport { openai } from '@ai-sdk/openai';\nimport { generateText } from 'ai';\n\nconst { text } = await generateText({\n  model: __MODEL__,\n  tools: myToolSet,\n  activeTools: ['firstTool'],\n});\n```"},"p":{"direct":{"R":0.86},"mid":{"M1":0.96,"M2":0.93},"decomposed":{"L1":0.96,"L2":0.98,"L3":0.78,"L4":0.17,"L5":0.9},"highrisk":{"M1":0.96,"L3":0.8,"L4":0.16,"L5":0.9}},"ctx":{"direct":"ctx-512496f9-714d-4c8f-a6e2-f4fa4bc775d6","mid":"ctx-bd21db48-fff4-434e-bd0d-0e615a4b21f8","decomposed":"ctx-3c0589d9-1168-4652-b9c4-4126ab805598","highrisk":"ctx-c2c93d7c-284c-438c-96e5-c2927104d4b2"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:7","label":null,"state":{"question":"How do I limit which tools are visible to the model in a given call?","chunk":"## Tool Choice\n\nYou can use the `toolChoice` setting to influence when a tool is selected. It supports the following settings:\n\n- `auto` (default): the model can choose whether and which tools to call.\n- `required`: the model must call a tool. It can choose which tool to call.\n- `none`: the model must not call tools\n- `{ type: 'tool', toolName: string (typed) }`: the model must call the specified tool\n\n```ts\nconst result = await generateText({\n  model: __MODEL__,\n  tools: {\n    weather: tool({\n      description: 'Get the weather in a location',\n      inputSchema: z.object({\n        location: z.string().describe('The location to get the weather for'),\n      }),\n      execute: async ({ location }) => ({\n        location,\n        temperature: 72 + Math.floor(Math.random() * 21) - 10,\n      }),\n    }),\n  },\n  toolChoice: 'required', // force the model to call a tool\n  prompt: 'What is the weather in San Francisco?',\n});\n```"},"p":{"direct":{"R":0.29},"mid":{"M1":0.16,"M2":0.45},"decomposed":{"L1":0.43,"L2":0.29,"L3":0.81,"L4":0.35,"L5":0.92},"highrisk":{"M1":0.16,"L3":0.8,"L4":0.4,"L5":0.91}},"ctx":{"direct":"ctx-3006983a-1433-4c51-bb8f-533130bfac43","mid":"ctx-04fd1a1f-7ab8-44fe-a636-ade04eff1937","decomposed":"ctx-f7d6a363-aa0c-4aab-8d06-3f969bd9887c","highrisk":"ctx-70ad80fb-2f95-4eb2-976a-afa088b9db01"},"R":{"direct":false,"mid":false,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":false,"M2":false},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":true}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":true,"M*-R":false},"failing":["L*-M2"],"near":{"L*-M2":true}},{"id":"doc:8","label":null,"state":{"question":"What error is thrown when the model calls a tool that doesn't exist?","chunk":"## Handling Errors\n\nThe AI SDK has four tool-call related errors:\n\n- `NoSuchToolError`: the model tries to call a tool that is not defined in the tools object\n- `InvalidToolInputError`: the model calls a tool with inputs that do not match the tool's input schema\n- `ToolCallRepairError`: an error that occurred during tool call repair\n- `ToolChoiceViolationError`: the `generateText` response does not satisfy a required or specifically selected tool choice\n\nWhen tool execution fails (errors thrown by your tool's `execute` function), the AI SDK adds them as `tool-error` content parts to enable automated LLM roundtrips in multi-step scenarios.\n\n### `generateText`\n\n`generateText` throws errors for tool schema validation issues and other errors, and can be handled using a `try`/`catch` block. Tool execution errors appear as `tool-error` parts in the result steps."},"p":{"direct":{"R":0.94},"mid":{"M1":0.98,"M2":0.65},"decomposed":{"L1":0.94,"L2":0.99,"L3":0.14,"L4":0.13,"L5":0.7},"highrisk":{"M1":0.97,"L3":0.15,"L4":0.14,"L5":0.7}},"ctx":{"direct":"ctx-1cc4ff2d-878c-4d15-951c-ab55723059b2","mid":"ctx-92d882c1-bcff-4fa6-8e05-f050b5a56309","decomposed":"ctx-f0cd0197-6618-4c9b-b8f1-33700aebf871","highrisk":"ctx-210dd069-5fc8-45ed-9c2e-075094430057"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":false},"highrisk":{"M1":true,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":true,"M*-R":false},"failing":[],"near":{"L*-M2":false}},{"id":"doc:9","label":null,"state":{"question":"What error is thrown when the model calls a tool that doesn't exist?","chunk":"## Tool Call Repair\n\nLanguage models sometimes fail to generate valid tool calls, especially when the input schema is complex or the model is smaller.\n\nIf you use multiple steps, those failed tool calls will be sent back to the LLM in the next step to give it an opportunity to fix it. However, you may want to control how invalid tool calls are repaired without requiring additional steps that pollute the message history.\n\nYou can use the `repairToolCall` function to attempt to repair the tool call with a custom function.\n\nYou can use different strategies to repair the tool call:\n\n- Use a model with structured outputs to generate the inputs.\n- Send the messages, instructions, and tool schema to a stronger model to generate the inputs.\n- Provide more specific repair instructions based on which tool was called."},"p":{"direct":{"R":0.14},"mid":{"M1":0.07,"M2":0.16},"decomposed":{"L1":0.24,"L2":0.07,"L3":0.19,"L4":0.11,"L5":0.22},"highrisk":{"M1":0.06,"L3":0.22,"L4":0.11,"L5":0.22}},"ctx":{"direct":"ctx-dbaf2d15-cb57-4d01-baf3-3ca3016307a3","mid":"ctx-f0352cce-7430-4c72-8c6d-800aacb235a5","decomposed":"ctx-708fa50b-731c-48c8-9ef9-520dd27f4bfe","highrisk":"ctx-0e3acde9-49c4-40be-a7d6-c7bd779bbb60"},"R":{"direct":false,"mid":false,"decomposed":false,"highrisk":false},"M":{"direct":{},"mid":{"M1":false,"M2":false},"decomposed":{"M1":false,"M2":false},"highrisk":{"M1":false,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:10","label":null,"state":{"question":"How can I log the parameters and text generated by a model call using middleware?","chunk":"### Logging\n\nThis example shows how to log the parameters and generated text of a language model call.\n\n```ts\nimport type { LanguageModelV4Middleware } from '@ai-sdk/provider';\n\nexport const yourLogMiddleware: LanguageModelV4Middleware = {\n  wrapGenerate: async ({ doGenerate, params }) => {\n    console.log('doGenerate called');\n    console.log(`params: ${JSON.stringify(params, null, 2)}`);\n\n    const result = await doGenerate();\n    const generatedText = result.content\n      .filter(part => part.type === 'text')\n      .map(part => part.text)\n      .join('');\n\n    console.log('doGenerate finished');\n    console.log(`generated text: ${generatedText}`);\n\n    return result;\n  },\n};\n```"},"p":{"direct":{"R":0.92},"mid":{"M1":0.96,"M2":0.92},"decomposed":{"L1":0.96,"L2":0.97,"L3":0.93,"L4":0.73,"L5":0.97},"highrisk":{"M1":0.96,"L3":0.93,"L4":0.75,"L5":0.98}},"ctx":{"direct":"ctx-6b27789f-bae6-44fb-942d-05c1068a5a27","mid":"ctx-0331839f-edb8-4a9a-b5f6-00d7d59df496","decomposed":"ctx-eaf54539-33ea-4c17-830a-ff14e3678738","highrisk":"ctx-ba6f5720-ebda-4e45-a68b-33f067e8b507"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:11","label":null,"state":{"question":"How can I log the parameters and text generated by a model call using middleware?","chunk":"### Guardrails\n\nGuard rails are a way to ensure that the generated text of a language model call is safe and appropriate. This example shows how to use guardrails as middleware.\n\n```ts\nimport type { LanguageModelV4Middleware } from '@ai-sdk/provider';\n\nexport const yourGuardrailMiddleware: LanguageModelV4Middleware = {\n  wrapGenerate: async ({ doGenerate }) => {\n    const result = await doGenerate();\n\n    // filtering approach, e.g. for PII or other sensitive information:\n    const content = result.content.map(part =>\n      part.type === 'text'\n        ? { ...part, text: part.text.replace(/badword/g, '\u003cREDACTED>') }\n        : part,\n    );\n\n    return { ...result, content };\n  },\n\n  // here you would implement the guardrail logic for streaming\n};\n```"},"p":{"direct":{"R":0.29},"mid":{"M1":0.11,"M2":0.41},"decomposed":{"L1":0.27,"L2":0.17,"L3":0.93,"L4":0.58,"L5":0.95},"highrisk":{"M1":0.11,"L3":0.92,"L4":0.57,"L5":0.95}},"ctx":{"direct":"ctx-7495e091-3a9e-446e-bc58-22c8e6398347","mid":"ctx-11e478a0-f777-4acf-a7dd-33b0cf5b604a","decomposed":"ctx-6b62fff0-11a2-441d-815d-048933302686","highrisk":"ctx-9db698c8-41a4-4c44-92a2-5a6fd55b33bf"},"R":{"direct":false,"mid":false,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":false,"M2":false},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":true}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":true,"M*-R":false},"failing":["L*-M2"],"near":{"L*-M2":false}},{"id":"doc:12","label":null,"state":{"question":"How do I build agent memory without depending on a specific provider?","chunk":"## Custom Tool\n\nBuilding your own memory tool from scratch is the most flexible approach. You control the storage format, the interface, and the retrieval logic. This requires the most upfront work but gives you full ownership of how memory works, with no provider lock-in and no external dependencies.\n\nThere are two common patterns:\n\n- Structured actions: you define explicit operations (`view`, `create`, `update`, `search`) and handle structured input yourself. Safe by design since you control every operation.\n- Bash-backed: you give the model a sandboxed bash environment to compose shell commands (`cat`, `grep`, `sed`, `echo`) for flexible memory access. More powerful but requires command validation for safety."},"p":{"direct":{"R":0.83},"mid":{"M1":0.86,"M2":0.09},"decomposed":{"L1":0.88,"L2":0.94,"L3":0.13,"L4":0.04,"L5":0.14},"highrisk":{"M1":0.84,"L3":0.14,"L4":0.04,"L5":0.15}},"ctx":{"direct":"ctx-300857d3-bab5-487c-9638-63edc741b4c1","mid":"ctx-97afee45-2b64-4795-9ba4-6357b366d0b3","decomposed":"ctx-ea157f95-01bc-4d3a-ba57-69f95116f807","highrisk":"ctx-e8a17b6d-c45d-4ea8-8cd9-65d70ed5d87c"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":false},"decomposed":{"M1":true,"M2":false},"highrisk":{"M1":true,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:13","label":null,"state":{"question":"How do I build agent memory without depending on a specific provider?","chunk":"### Anthropic Memory Tool\n\nThe Anthropic Memory Tool gives Claude a structured interface for managing a `/memories` directory. Claude reads its memory before starting tasks, creates and updates files as it works, and references them in future conversations.\n\n```ts\nimport { anthropic } from '@ai-sdk/anthropic';\nimport { ToolLoopAgent } from 'ai';\n\nconst memory = anthropic.tools.memory_20250818({\n  execute: async action => {\n    // Implement your storage backend here.\n    // Return the result as a string.\n  },\n});\n\nconst agent = new ToolLoopAgent({\n  model: 'anthropic/claude-haiku-4.5',\n  tools: { memory },\n});\n```\n\nWhen to use this: you want memory with minimal implementation effort and are already using Anthropic models. The tradeoff is provider lock-in, since this tool only works with Claude."},"p":{"direct":{"R":0.36},"mid":{"M1":0.15,"M2":0.52},"decomposed":{"L1":0.71,"L2":0.27,"L3":0.81,"L4":0.29,"L5":0.93},"highrisk":{"M1":0.18,"L3":0.81,"L4":0.29,"L5":0.94}},"ctx":{"direct":"ctx-3dfe4139-90bb-4501-8c8f-7cac51aebcf1","mid":"ctx-ba1b80f6-4dd3-4572-912a-5be1364ae2d7","decomposed":"ctx-8e42af80-029d-4ab7-9a07-e70900d703ab","highrisk":"ctx-c98b48d7-7e26-4bab-a403-a67b068fd4d3"},"R":{"direct":false,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":false,"M2":true},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":true}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":true},"failing":["M*-R"],"near":{"M*-R":true}},{"id":"doc:14","label":null,"state":{"question":"What callback fires when a stream is aborted by the user?","chunk":"## Handling stream aborts\n\nWhen streams are aborted (e.g., via chat stop button), you may want to perform cleanup operations like updating stored messages in your UI. Use the `onAbort` callback to handle these cases.\n\nThe `onAbort` callback is called when a stream is aborted via `AbortSignal`, but `onEnd` is not called. This ensures you can still update your UI state appropriately.\n\n```ts\nimport { streamText } from 'ai';\n\nconst { textStream } = streamText({\n  model: __MODEL__,\n  prompt: 'Write a vegetarian lasagna recipe for 4 people.',\n  onAbort: ({ steps }) => {\n    console.log('Stream aborted after', steps.length, 'steps');\n  },\n  onEnd: ({ steps, totalUsage }) => {\n    console.log('Stream completed normally');\n  },\n});\n```\n\nThe `onAbort` callback receives:\n\n- `steps`: An array of all completed steps before the abort"},"p":{"direct":{"R":0.92},"mid":{"M1":0.97,"M2":0.92},"decomposed":{"L1":0.96,"L2":0.98,"L3":0.89,"L4":0.32,"L5":0.94},"highrisk":{"M1":0.97,"L3":0.88,"L4":0.29,"L5":0.94}},"ctx":{"direct":"ctx-e381d6ea-2fc1-4135-afb6-f3068c04145c","mid":"ctx-1948d5c7-7000-46f2-b305-7dbd14148601","decomposed":"ctx-13538ec6-ca51-4cb4-9b9a-10231515296f","highrisk":"ctx-4664bff2-9dd9-44bd-bc65-0ee029d95860"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:15","label":null,"state":{"question":"What callback fires when a stream is aborted by the user?","chunk":"## Retrying provider errors after streaming starts\n\n`maxRetries` retries failures that happen while starting a model call. To retry well-formed provider error events received after response streaming has begun, set `streamRetries`:\n\n```ts\nimport { streamText } from 'ai';\n\nconst { textStream } = streamText({\n  model: __MODEL__,\n  prompt: 'Write a vegetarian lasagna recipe for 4 people.',\n  streamRetries: 2,\n});\n```\n\nStream retries rerun only the failed model step with the same accumulated conversation and generation context. Earlier completed steps, including their tool calls and tool results, are not replayed. Tool input, tool calls, approval requests, tool callbacks, and client-side tool execution from a failed attempt are discarded."},"p":{"direct":{"R":0.07},"mid":{"M1":0.03,"M2":0.55},"decomposed":{"L1":0.07,"L2":0.04,"L3":0.5,"L4":0.46,"L5":0.86},"highrisk":{"M1":0.04,"L3":0.47,"L4":0.45,"L5":0.85}},"ctx":{"direct":"ctx-9459909b-2b03-439a-a056-36b041325c57","mid":"ctx-91a02f4c-be78-4db1-8558-6d49274bf2a1","decomposed":"ctx-07b073a4-e06d-4c6b-b074-9bc77f435350","highrisk":"ctx-16ed85b7-109c-4144-9446-dda27094119c"},"R":{"direct":false,"mid":true,"decomposed":true,"highrisk":false},"M":{"direct":{},"mid":{"M1":false,"M2":true},"decomposed":{"M1":false,"M2":true},"highrisk":{"M1":false,"M2":false}},"consistent":false,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":true},"failing":["M*-R"],"near":{"M*-R":true}},{"id":"doc:16","label":null,"state":{"question":"What is a large language model, conceptually?","chunk":"## Large Language Models\n\nA large language model (LLM) is a subset of generative models focused primarily on text. An LLM takes a sequence of words as input and aims to predict the most likely sequence to follow. It assigns probabilities to potential next sequences and then selects one. The model continues to generate sequences until it meets a specified stopping criterion.\n\nLLMs learn by training on massive collections of written text, which means they will be better suited to some use cases than others. For example, a model trained on GitHub data would understand the probabilities of sequences in source code particularly well.\n\nHowever, it's crucial to understand LLMs' limitations. When asked about less known or absent information, like the birthday of a personal relative, LLMs might \"hallucinate\" or make up information. It's essential to consider how well-represented the information you need is in the model."},"p":{"direct":{"R":0.9},"mid":{"M1":0.91,"M2":0.03},"decomposed":{"L1":0.94,"L2":0.94,"L3":0.05,"L4":0.02,"L5":0.02},"highrisk":{"M1":0.91,"L3":0.05,"L4":0.02,"L5":0.02}},"ctx":{"direct":"ctx-9dbc0175-83f4-4c42-ba55-48a7a4500c9c","mid":"ctx-613f20c3-d780-4a52-bff3-3caf8fbe3e7a","decomposed":"ctx-b9d4c418-37c9-4a24-8adb-036a94ef056a","highrisk":"ctx-eb041cec-5451-423e-a9bd-b1bed81c9f8c"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":false},"decomposed":{"M1":true,"M2":false},"highrisk":{"M1":true,"M2":false}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}},{"id":"doc:17","label":null,"state":{"question":"What does the maxParallelCalls option do in embedMany?","chunk":"### Parallel Requests\n\nThe `embedMany` function now supports parallel processing with configurable `maxParallelCalls` to optimize performance:\n\n```ts\nimport { embedMany } from 'ai';\n\nconst { embeddings, usage } = await embedMany({\n  maxParallelCalls: 2, // Limit parallel requests\n  model: 'openai/text-embedding-3-small',\n  values: [\n    'sunny day at the beach',\n    'rainy afternoon in the city',\n    'snowy night in the mountains',\n  ],\n});\n```"},"p":{"direct":{"R":0.94},"mid":{"M1":0.96,"M2":0.9},"decomposed":{"L1":0.99,"L2":0.97,"L3":0.78,"L4":0.76,"L5":0.89},"highrisk":{"M1":0.96,"L3":0.76,"L4":0.78,"L5":0.87}},"ctx":{"direct":"ctx-697dd079-1afa-4fa2-8508-4b2277497b2d","mid":"ctx-f82bf226-ae9e-4b8d-9368-eed77b547e0d","decomposed":"ctx-4e63e1cb-c34f-4130-bf15-7bf55db0a3bc","highrisk":"ctx-f8b79eba-8119-46cc-87dd-70c36ed3f415"},"R":{"direct":true,"mid":true,"decomposed":true,"highrisk":true},"M":{"direct":{},"mid":{"M1":true,"M2":true},"decomposed":{"M1":true,"M2":true},"highrisk":{"M1":true,"M2":true}},"consistent":true,"edges":{"L*-M1":false,"L*-M2":false,"M*-R":false},"failing":[],"near":{}}]}]};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const pct = x => x == null ? '—' : (100 * x).toFixed(1) + '%';
const C = ['direct', 'mid', 'decomposed', 'highrisk'];
let cur = 0;
try { const s = localStorage.getItem('oc-tab'); if (s) cur = Math.min(+s, D.trees.length - 1); } catch {}
document.getElementById('meta').textContent = 'Jev ' + D.trees[0].jev + ' · answered by ' + D.trees[0].answeredBy.join(', ') + ' · ' + D.trees.reduce((s, t) => s + t.calls, 0) + ' calls · tree verdict rule: OC ≥ ' + D.ocMin + ' and every edge group ≤ ' + D.edgeMax + ' (declared before the run) · consistency is not correctness';

function tabs() {
  document.getElementById('tabs').innerHTML = D.trees.map((t, i) =>
    '<button role="tab" aria-selected="' + (i === cur) + '" data-i="' + i + '">' + esc(t.slug) + ' · ' + t.verdict + '</button>').join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { cur = +b.dataset.i; try { localStorage.setItem('oc-tab', cur); } catch {} tabs(); render(); });
}

function heat(x) { return 'background: rgba(var(--heat), ' + Math.min(0.85, (x || 0) * 1.6).toFixed(2) + ')'; }

function render() {
  const t = D.trees[cur];
  const c = t.correctness;
  const pw = Object.entries(t.pairwise).map(([k, v]) => '<tr><td>' + esc(k.replace('~', ' ~ ')) + '</td><td class="heat" style="' + heat(1 - v.rate) + '">' + pct(v.rate) + '</td><td>' + v.agree + '/' + v.n + '</td></tr>').join('');
  const edges = t.edges.map(e => '<tr><td><b>' + esc(e.edge) + '</b>' + (e.highRisk ? ' <span class="chip">declared high-risk</span>' : '') +
    '<div class="meta">' + esc(e.node === 'R' ? 'R direct vs R from mids' : e.node + ' direct vs ' + e.node + ' = ' + t.compose[e.node]) + '</div></td>' +
    '<td class="heat" style="' + heat(e.rate) + '">' + pct(e.rate) + '<div class="meta">' + e.disagree + '/' + e.n + '</div></td>' +
    '<td class="heat" style="' + heat(e.disagree ? e.loadBearing / e.n : 0) + '">' + e.loadBearing + '</td>' +
    '<td class="heat">' + e.nearThreshold + '</td>' +
    '<td>' + esc(Object.entries(e.pivots).map(([k, v]) => k + ' ' + v).join(', ') || '—') + '</td></tr>').join('');
  const groups = t.edges.map(e => e.edge);
  const cols = 'grid-template-columns: repeat(' + t.items.length + ', 1fr)';
  const strip = groups.map(g => '<div class="row"><span>' + esc(g) + '</span><div class="cells" style="' + cols + '">' +
    t.items.map(it => '<div class="c' + (it.edges[g] ? ' on' : '') + '" title="' + esc(it.id) + '"></div>').join('') + '</div></div>').join('') +
    '<div class="row"><span>OC fail</span><div class="cells" style="' + cols + '">' + t.items.map(it => '<div class="c' + (it.consistent === false ? ' on' : '') + '" title="' + esc(it.id) + '"></div>').join('') + '</div></div>';
  const corr = c ? '<h3>Correctness (labels used for logging only)</h3><div class="stats">' +
    C.map(k => '<div class="stat"><b>' + pct(c.accuracy[k]) + '</b><span>' + k + ' accuracy</span></div>').join('') +
    '<div class="stat"><b>' + pct(c.majorityBaseline) + '</b><span>majority baseline</span></div>' +
    '<div class="stat"><b>' + c.directOnConsistent.right + '/' + c.directOnConsistent.n + ' vs ' + c.directOnInconsistent.right + '/' + c.directOnInconsistent.n + '</b><span>direct right: OC-consistent vs inconsistent · Fisher p ' + c.fisher.p + '</span></div>' +
    '<div class="stat"><b>' + c.mcnemarDirectVsDecomposed.direct_only_right + ' vs ' + c.mcnemarDirectVsDecomposed.decomposed_only_right + '</b><span>direct vs decomposed, exact McNemar p ' + c.mcnemarDirectVsDecomposed.p + '</span></div></div>' : '<p class="meta">Label-free tree: no correctness numbers.</p>';
  const nodes = Object.entries(t.text).map(([k, v]) => '<dt>' + k + (t.compose[k] ? ' = ' + esc(t.compose[k]) : '') + '</dt><dd>' + esc(v) + '</dd>').join('');
  document.getElementById('tree').innerHTML =
    '<div class="card"><h2>' + esc(t.slug) + ' <span class="verdict v-' + t.verdict + '">' + t.verdict + '</span></h2>' +
    '<div class="meta">toq sha256 ' + t.sha + '… · high-risk edge ' + esc(t.highRiskEdge) + ' · ' + t.calls + ' calls' + (t.reasons.length ? ' · ' + esc(t.reasons.join('; ')) : '') + '</div>' +
    '<div class="stats"><div class="stat"><b>' + pct(t.ocRate) + '</b><span>all four collapses agree (95% CI ' + t.ocCI95.map(pct).join('–') + ')</span></div>' +
    '<div class="stat"><b>' + pct(t.oc_signal) + '</b><span>oc_signal (worst pair)</span></div>' +
    '<div class="stat"><b>' + t.replication.p95AbsDp + '</b><span>p95 |Δp| of ' + t.replication.node + ' asked in two batches (P4 band 0.07), ' + t.replication.flips + ' flips</span></div></div>' +
    '<details><summary>Question text and compose rules</summary><dl class="nodes">' + nodes + '</dl></details></div>' +
    '<div class="card"><h3 style="margin-top:0">Edge heatmap</h3><div class="scroll"><table><thead><tr><th>edge group</th><th>disagree</th><th>load-bearing</th><th>near 0.5</th><th>pivotal nodes (heuristic)</th></tr></thead><tbody>' + edges + '</tbody></table></div>' +
    '<div class="strip" aria-label="Per-item disagreement strip">' + strip + '</div>' +
    '<h3>Pairwise agreement</h3><div class="scroll"><table><tbody>' + pw + '</tbody></table></div>' + corr + '</div>' +
    '<div class="toolbar"><select id="f" aria-label="Filter items"><option value="all">all items</option><option value="bad">OC-inconsistent</option><option value="good">OC-consistent</option>' +
    groups.map(g => '<option value="e:' + esc(g) + '">' + esc(g) + ' disagrees</option>').join('') +
    (c ? '<option value="wrong">direct wrong</option>' : '') + '</select><input id="q" type="search" placeholder="search state or id" aria-label="Search"><span class="count" id="count"></span></div><div id="items"></div>';
  document.getElementById('f').onchange = list; document.getElementById('q').oninput = list;
  list();
}

function list() {
  const t = D.trees[cur];
  const f = document.getElementById('f').value, q = document.getElementById('q').value.toLowerCase();
  const rows = t.items.filter(it => {
    if (f === 'bad' && it.consistent !== false) return false;
    if (f === 'good' && it.consistent !== true) return false;
    if (f.startsWith('e:') && !it.edges[f.slice(2)]) return false;
    if (f === 'wrong' && !(it.R && it.label !== null && it.R.direct !== it.label)) return false;
    return !q || (it.id + ' ' + JSON.stringify(it.state)).toLowerCase().includes(q);
  });
  document.getElementById('count').textContent = rows.length + ' / ' + t.items.length;
  document.getElementById('items').innerHTML = rows.map(it => {
    const st = Object.entries(it.state).map(([k, v]) => (Object.keys(it.state).length > 1 ? k + ': ' : '') + v).join('\n');
    const r = it.R ? C.map(k => '<span class="chip ' + (it.R[k] ? 't' : 'f') + '">' + k + ' ' + (it.R[k] ? 'yes' : 'no') + '</span>').join('') : '<span class="chip e">call failed</span>';
    const e = Object.entries(it.edges).filter(([, d]) => d).map(([g]) => '<span class="chip e">' + esc(g) + (it.near[g] ? ' · near 0.5' : '') + '</span>').join('');
    const lab = it.label === null ? '' : '<span class="chip">gold ' + (it.label ? 'yes' : 'no') + '</span>';
    const p = C.map(k => '<tr><td>' + k + '</td><td>' + esc(Object.entries(it.p[k] || {}).map(([n, v]) => n + ' ' + v.toFixed(2)).join(' · ')) +
      (it.M[k] && Object.keys(it.M[k]).length ? '<div class="meta">→ ' + esc(Object.entries(it.M[k]).map(([n, v]) => n + ' ' + (v ? 'yes' : 'no')).join(' · ')) + '</div>' : '') +
      '</td><td class="id">' + esc(it.ctx[k] || '') + '</td></tr>').join('');
    return '<div class="item' + (it.consistent === false ? ' bad' : '') + '"><div class="head"><span class="id">' + esc(it.id) + '</span>' + lab + r + e + '</div>' +
      '<div class="state">' + esc(st) + '</div><details><summary>raw p, composed nodes, context ids</summary><div class="scroll"><table><tbody>' + p + '</tbody></table></div></details></div>';
  }).join('');
}

document.getElementById('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
tabs(); render();
</script>
</body>
</html>
